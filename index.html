<!DOCTYPE html>
<html lang="ckb" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060d1f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>فارسی‌یار (FarsiYar) — فێربوونی فارسیی ئێرانی بۆ کوردیی سۆرانی | v1.1</title>
  <script src="https://cdn.tailwindcss.com/3.4.17" async></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030712;
      --card: #0b1220;
      --border: rgba(56, 189, 248, 0.15);
      --accent: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(34, 211, 238, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 45%),
        radial-gradient(at 50% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
      color: #f1f5f9;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
      padding-bottom: calc(4.75rem + env(safe-area-inset-bottom, 0px));
      line-height: 1.5;
    }
    @media (min-width: 1024px) {
      body { padding-bottom: 2rem; }
    }
    [lang="fa"] {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
    }
    /* Offline Fallback CSS Utilities so app looks great even without CDN */
    .hidden { display: none !important; }
    .flex { display: flex; }
    .inline-flex { display: inline-flex; }
    .grid { display: grid; }
    .flex-col { flex-direction: column; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .gap-1 { gap: 0.25rem; }
    .gap-1\.5 { gap: 0.375rem; }
    .gap-2 { gap: 0.5rem; }
    .gap-2\.5 { gap: 0.625rem; }
    .gap-3 { gap: 0.75rem; }
    .gap-3\.5 { gap: 0.875rem; }
    .gap-4 { gap: 1rem; }
    .gap-5 { gap: 1.25rem; }
    .p-1 { padding: 0.25rem; }
    .p-1\.5 { padding: 0.375rem; }
    .p-2 { padding: 0.5rem; }
    .p-2\.5 { padding: 0.625rem; }
    .p-3 { padding: 0.75rem; }
    .p-3\.5 { padding: 0.875rem; }
    .p-4 { padding: 1rem; }
    .p-5 { padding: 1.25rem; }
    .p-6 { padding: 1.5rem; }
    .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
    .px-2\.5 { padding-left: 0.625rem; padding-right: 0.625rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .px-3\.5 { padding-left: 0.875rem; padding-right: 0.875rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .py-1\.5 { padding-top: 0.375rem; padding-bottom: 0.375rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }
    .py-5 { padding-top: 1.25rem; padding-bottom: 1.25rem; }
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mb-5 { margin-bottom: 1.25rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .w-full { width: 100%; }
    .max-w-7xl { max-width: 80rem; }
    .max-w-3xl { max-width: 48rem; }
    .max-w-2xl { max-width: 42rem; }
    .max-w-xl { max-width: 36rem; }
    .rounded-lg { border-radius: 0.5rem; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-2xl { border-radius: 1rem; }
    .rounded-3xl { border-radius: 1.5rem; }
    .rounded-full { border-radius: 9999px; }
    .border { border: 1px solid rgba(51, 65, 85, 0.75); }
    .border-2 { border: 2px solid rgba(59, 130, 246, 0.45); }
    .bg-slate-950 { background-color: #020617; }
    .bg-slate-900 { background-color: #0f172a; }
    .bg-slate-800 { background-color: #1e293b; }
    .bg-blue-600 { background-color: #2563eb; }
    .bg-cyan-600 { background-color: #0891b2; }
    .bg-indigo-600 { background-color: #4f46e5; }
    .bg-emerald-600 { background-color: #059669; }
    .bg-rose-600 { background-color: #e11d48; }
    .text-white { color: #ffffff; }
    .text-slate-100 { color: #f1f5f9; }
    .text-slate-200 { color: #e2e8f0; }
    .text-slate-300 { color: #cbd5e1; }
    .text-slate-400 { color: #94a3b8; }
    .text-cyan-200 { color: #a5f3fc; }
    .text-cyan-300 { color: #67e8f9; }
    .text-cyan-400 { color: #22d3ee; }
    .text-amber-300 { color: #fcd34d; }
    .text-emerald-300 { color: #6ee7b7; }
    .text-emerald-400 { color: #34d399; }
    .font-bold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .text-xs { font-size: 0.75rem; }
    .text-sm { font-size: 0.875rem; }
    .text-base { font-size: 1rem; }
    .text-lg { font-size: 1.125rem; }
    .text-xl { font-size: 1.25rem; }
    .text-2xl { font-size: 1.5rem; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    button { cursor: pointer; font-family: inherit; transition: all 0.15s ease; }
    button:active { transform: scale(0.97); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s ease-out forwards;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(34, 211, 238, 0.35);
      border-radius: 9999px;
    }
    header {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyan-500 selection:text-slate-950">

  <!-- Sticky Top Header -->
  <header class="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-blue-900/50">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <!-- Brand Logo -->
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-blue-600 via-indigo-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-blue-600/30 border border-cyan-300/30">
          <span class="text-lg font-black text-white">ف</span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-base sm:text-lg text-white tracking-tight">فارسی‌یار</span>
            <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-blue-900/70 text-cyan-300 border border-blue-700/50">FarsiYar</span>
          </div>
          <p class="text-[11px] text-slate-400 hidden sm:block">فێربوونی فارسیی ئێرانی (فەرمی و ئاخاوتنی) بە کوردیی سۆرانی</p>
        </div>
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden lg:flex items-center gap-1.5 bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800" aria-label="Primary Navigation">
        <button id="nav-desktop-lessons" type="button" onclick="switchTab('lessons')">
          <span>📚</span><span>وانەکان</span>
        </button>
        <button id="nav-desktop-vocab" type="button" onclick="switchTab('vocab')">
          <span>🗂️</span><span>فەرهەنگ</span>
        </button>
        <button id="nav-desktop-builder" type="button" onclick="switchTab('builder')">
          <span>🧩</span><span>ڕستەسازی</span>
        </button>
        <button id="nav-desktop-conversations" type="button" onclick="switchTab('conversations')">
          <span>💬</span><span>گفتوگۆکان</span>
        </button>
        <button id="nav-desktop-quiz" type="button" onclick="switchTab('quiz')">
          <span>🎯</span><span>تاقیکردنەوە</span>
        </button>
        <button id="nav-desktop-progress" type="button" onclick="switchTab('progress')">
          <span>📊</span><span>پێشکەوتن و سیستەم</span>
        </button>
      </nav>

      <!-- Global Controls: Pronunciation Toggle & XP/Streak -->
      <div class="flex items-center gap-2">
        <button id="global-pron-btn" type="button" onclick="toggleGlobalPronunciation()" class="px-3 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-cyan-500/40 text-xs font-bold text-cyan-200 flex items-center gap-2 transition" title="شاردنەوە یان پیشاندانی خوێندنەوەی کوردیی سۆرانی">
          <span id="global-pron-badge" class="w-2.5 h-2.5 rounded-full bg-cyan-400"></span>
          <span id="global-pron-text">خوێندنەوەی سۆرانی: دیارە</span>
        </button>

        <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-amber-300">
          <span>🔥</span>
          <span id="header-streak">3 ڕۆژ</span>
        </div>

        <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-blue-950/80 border border-blue-500/40 text-xs font-extrabold text-cyan-300">
          <span>⭐</span>
          <span id="header-xp">40 XP</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="view-container" class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-5">
    <!-- Populated dynamically by FarsiYar app_logic.js -->
  </main>

  <!-- Live Audio & Phonetic Feedback Toast -->
  <div id="farsiyar-toast" class="fixed bottom-20 lg:bottom-6 left-4 right-4 sm:left-auto sm:right-6 sm:max-w-sm z-50 pointer-events-none opacity-0 translate-y-4 transition-all duration-300">
    <div class="p-3.5 rounded-2xl bg-slate-950/95 backdrop-blur-md border border-cyan-400/50 shadow-2xl shadow-cyan-950/60">
      <div id="toast-title" class="text-xs font-bold text-cyan-400 mb-1">🔊 خوێندنەوەی فارسی</div>
      <div id="toast-fa" class="text-base font-extrabold text-white" lang="fa"></div>
      <div id="toast-pron" class="text-xs text-amber-300 font-semibold mt-0.5"></div>
    </div>
  </div>

  <!-- Mobile Bottom Navigation Bar (iPhone & Mobile First) -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-md border-t border-blue-900/60 grid grid-cols-6 pb-[env(safe-area-inset-bottom,0px)]" aria-label="Mobile Navigation">
    <button id="nav-mobile-lessons" type="button" onclick="switchTab('lessons')">
      <span class="text-base">📚</span>
      <span class="mt-0.5">وانەکان</span>
    </button>
    <button id="nav-mobile-vocab" type="button" onclick="switchTab('vocab')">
      <span class="text-base">🗂️</span>
      <span class="mt-0.5">فەرهەنگ</span>
    </button>
    <button id="nav-mobile-builder" type="button" onclick="switchTab('builder')">
      <span class="text-base">🧩</span>
      <span class="mt-0.5">ڕستەسازی</span>
    </button>
    <button id="nav-mobile-conversations" type="button" onclick="switchTab('conversations')">
      <span class="text-base">💬</span>
      <span class="mt-0.5">گفتوگۆ</span>
    </button>
    <button id="nav-mobile-quiz" type="button" onclick="switchTab('quiz')">
      <span class="text-base">🎯</span>
      <span class="mt-0.5">تاقیکردنەوە</span>
    </button>
    <button id="nav-mobile-progress" type="button" onclick="switchTab('progress')">
      <span class="text-base">📊</span>
      <span class="mt-0.5">پێشکەوتن</span>
    </button>
  </nav>

  <script>

  </script>
</body>
</html>
