      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      console.warn("LocalStorage write fallback:", err);
    }
    updateHeaderStats();
  }

  // Audio Engine: Web Speech API (fa-IR) + Web Audio API acoustic feedback
  let audioCtx = null;
  let availableVoices = [];
  let faVoiceFound = false;
  let convPlayTimer = null;

  function refreshVoices() {
    if (!("speechSynthesis" in window)) return;
    try {
      availableVoices = window.speechSynthesis.getVoices() || [];
      faVoiceFound = availableVoices.some(function (v) {
        const lang = (v.lang || "").toLowerCase();
        const name = (v.name || "").toLowerCase();
        return lang.indexOf("fa") !== -1 || name.indexOf("persian") !== -1 || name.indexOf("farsi") !== -1;
      });
    } catch (e) {
      availableVoices = [];
    }
  }

  if ("speechSynthesis" in window) {
    refreshVoices();
    if (typeof window.speechSynthesis.onvoiceschanged !== "undefined") {
      window.speechSynthesis.onvoiceschanged = refreshVoices;
    }
  }

  function playSynthTone(type, slow) {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!audioCtx) audioCtx = new AudioContextClass();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "success") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.09);
        osc.frequency.setValueAtTime(783.99, now + 0.18);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.36);
      } else if (type === "error") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(180, now + 0.12);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
        osc.start(now);
        osc.stop(now + 0.3);
      } else {
        // Gentle speech cue pulse
        const dur = slow ? 0.28 : 0.18;
        osc.type = "sine";
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(554.37, now + dur);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      }
    } catch (e) {
      // Ignore audio errors if blocked before interaction
    }
  }

  function showToast(titleSorani, faText, soraniPron) {
    const toast = document.getElementById("farsiyar-toast");
    if (!toast) return;
    const titleEl = document.getElementById("toast-title");
    const faEl = document.getElementById("toast-fa");
    const pronEl = document.getElementById("toast-pron");

    if (titleEl) titleEl.textContent = titleSorani || "";
    if (faEl) faEl.textContent = faText || "";
    if (pronEl) {
      pronEl.textContent = soraniPron ? "خوێندنەوە: " + soraniPron : "";
      pronEl.style.display = soraniPron ? "block" : "none";
    }

    toast.classList.remove("hidden", "opacity-0", "translate-y-4");
    toast.classList.add("opacity-100", "translate-y-0");

    if (window._toastTimeout) clearTimeout(window._toastTimeout);
    window._toastTimeout = setTimeout(function () {
      toast.classList.remove("opacity-100", "translate-y-0");
      toast.classList.add("opacity-0", "translate-y-4");
    }, 3200);
  }

  window.speakPersian = function (faText, soraniPron, slow) {
    playSynthTone("speak", slow);
    const speedLabel = slow ? "🐢 خوێندنەوەی خاو (٠.٧x)" : "🔊 خوێندنەوەی فارسی (fa-IR)";
    showToast(speedLabel, faText, soraniPron);

    if ("speechSynthesis" in window) {
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(faText);
        utter.lang = "fa-IR";
        utter.rate = slow ? 0.7 : 0.92;
        utter.pitch = 1.0;

        if (!availableVoices.length) refreshVoices();
        const faVoice = availableVoices.find(function (v) {
          const lang = (v.lang || "").toLowerCase();
          const name = (v.name || "").toLowerCase();
          return lang.indexOf("fa") !== -1 || name.indexOf("persian") !== -1 || name.indexOf("farsi") !== -1;
        }) || availableVoices.find(function (v) {
          return (v.lang || "").toLowerCase().indexOf("ar") !== -1;
        });

        if (faVoice) utter.voice = faVoice;
        window.speechSynthesis.speak(utter);
      } catch (e) {
        console.warn("SpeechSynthesis fallback:", e);
      }
    }
  };

  function isPronVisible(itemId) {
    return state.showPronunciation || Boolean(state.revealedPronIds[itemId]);
  }

  window.toggleGlobalPronunciation = function () {
    state.showPronunciation = !state.showPronunciation;
    saveState();
    renderActiveView();
    showToast(
      state.showPronunciation ? "👁️ ڕێنووسی خوێندنەوەی سۆرانی چالاک کرا" : "🙈 ڕێنووسی خوێندنەوەی سۆرانی شاردرایەوە",
      state.showPronunciation ? "هەموو سەرەداوەکانی خوێندنەوە دیارن" : "کلیک لەسەر (👁️ خوێندنەوە) بکە بۆ بینینی هەر کارتێک",
      ""
    );
  };

  window.toggleItemPron = function (itemId) {
    state.revealedPronIds[itemId] = !state.revealedPronIds[itemId];
    renderActiveView();
  };

  window.setRegisterMode = function (mode) {
    state.registerMode = mode;
    saveState();
    renderActiveView();
  };

    stopConversationPlayback();
    state.activeTab = tabName;
    saveState();
    renderNavigation();
    renderActiveView();
    window.scrollTo({ top: 0, behavior: "smooth" });

    const tabs = ["lessons", "vocab", "builder", "conversations", "quiz", "progress"];

  window.selectUnit = function (unitId) {
    state.activeUnitId = unitId;

  window.toggleLearnItem = function (itemId) {
    const wasLearned = Boolean(state.learnedLessonItems[itemId]);
    state.learnedLessonItems[itemId] = !wasLearned;
    if (!wasLearned) {
      state.xp += 10;
      playSynthTone("success", false);
      showToast("ئافەرین! +١٠ خاڵی ئەزموون (XP)", "ڕستەکە وەک فێربوو تۆمار کرا", "");

    saveState();
    renderLessonsView();
  };

  window.markUnitComplete = function (unitId) {
    const unit = window.FARSIYAR_DATA.units.find(function (u) { return u.id === unitId; });
    if (!unit) return;
    unit.items.forEach(function (it) {
      state.learnedLessonItems[it.id] = true;
    });
    if (!state.completedUnits[unitId]) {
      state.completedUnits[unitId] = true;
      state.xp += 35;
      playSynthTone("success", false);
      showToast("پیرۆزە! یەکەکە بە تەواوی تەواو کرا 🎉 (+٣٥ XP)", unit.title, "");
    } else {
      showToast("ئەم یەکەیە پێشتر تەواو کراوە ✅", unit.title, "");
    }
    saveState();
    renderLessonsView();
  };

  // =========================================================================
  // VIEW 2: VOCABULARY & FLASHCARDS (وشەساز و فەرهەنگ)
  // =========================================================================
  function getFilteredVocab() {
    const all = window.FARSIYAR_DATA.vocabulary;
    const q = (state.vocabSearch || "").trim().toLowerCase();
    return all.filter(function (v) {
      if (state.vocabCategory !== "هەمووی" && v.category !== state.vocabCategory) return false;
      if (state.vocabFilterStatus === "starred" && !state.starredVocab[v.id]) return false;
      if (state.vocabFilterStatus === "mastered" && !state.masteredVocab[v.id]) return false;
      if (q) {
        const hay = (v.faFormal + " " + v.faSpoken + " " + v.soraniPron + " " + v.soraniMeaning + " " + v.exampleFa + " " + v.exampleSorani).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  window.setVocabViewMode = function (mode) {
    state.vocabViewMode = mode;
    state.flashcardIndex = 0;
    state.flashcardFlipped = false;
    saveState();
    renderVocabView();
  };

  window.setVocabCategory = function (cat) {
    state.vocabCategory = cat;
    state.flashcardIndex = 0;
    state.flashcardFlipped = false;
    saveState();
    renderVocabView();
  };

  window.setVocabFilterStatus = function (st) {
    state.vocabFilterStatus = st;
    state.flashcardIndex = 0;
    state.flashcardFlipped = false;
    saveState();
    renderVocabView();
  };

  window.handleVocabSearch = function (val) {
    state.vocabSearch = val;
    state.flashcardIndex = 0;
    renderVocabView();
    const input = document.getElementById("vocab-search-input");
    if (input) {
      input.focus();
      input.setSelectionRange(val.length, val.length);
    }
  };

  window.toggleStarVocab = function (id) {
    state.starredVocab[id] = !state.starredVocab[id];
    saveState();
    renderVocabView();
  };

  window.toggleMasterVocab = function (id) {
    const was = Boolean(state.masteredVocab[id]);
    state.masteredVocab[id] = !was;
    if (!was) {
      state.xp += 5;

  // =========================================================================
  // VIEW 3: SENTENCE BUILDER (ڕستەسازی)
  // =========================================================================
  function initSentenceBuilder(index, shouldRender) {
    const list = window.FARSIYAR_DATA.sentenceBuilders;
    const safeIdx = ((index % list.length) + list.length) % list.length;
    state.sbIndex = safeIdx;
    state.sbSelectedTokens = [];
    state.sbStatus = null;

    const item = list[safeIdx];
    const combined = item.tokens.concat(item.distractors).map(function (t, i) {
      return { id: "tok-" + safeIdx + "-" + i, fa: t.fa, pron: t.pron, meaning: t.meaning };
    });
    // Deterministic shuffle so tiles are mixed nicely
    for (let i = combined.length - 1; i > 0; i--) {
      const j = (i * 7 + safeIdx * 3) % (i + 1);
      const tmp = combined[i];
      combined[i] = combined[j];
      combined[j] = tmp;
    }
    state.sbPoolTokens = combined;
    if (shouldRender) renderBuilderView();
  }

  window.selectSbExercise = function (idx) {
    initSentenceBuilder(idx, true);
  };

  window.pickSbToken = function (tokId) {
    const idx = state.sbPoolTokens.findIndex(function (t) { return t.id === tokId; });
    if (idx === -1) return;
    const tok = state.sbPoolTokens[idx];
    state.sbPoolTokens.splice(idx, 1);
    state.sbSelectedTokens.push(tok);
    state.sbStatus = null;
    window.speakPersian(tok.fa, tok.pron, false);
    renderBuilderView();
  };

  window.unpickSbToken = function (tokId) {
    const idx = state.sbSelectedTokens.findIndex(function (t) { return t.id === tokId; });
    if (idx === -1) return;
    const tok = state.sbSelectedTokens[idx];
    state.sbSelectedTokens.splice(idx, 1);
    state.sbPoolTokens.push(tok);
    state.sbStatus = null;
    renderBuilderView();
  };

  window.clearSbSentence = function () {
    initSentenceBuilder(state.sbIndex, true);
  };

  window.giveSbHint = function () {
    const item = window.FARSIYAR_DATA.sentenceBuilders[state.sbIndex];
    const nextIdx = state.sbSelectedTokens.length;
    if (nextIdx >= item.tokens.length) return;
    const neededFa = item.tokens[nextIdx].fa;
    const poolMatch = state.sbPoolTokens.find(function (t) { return t.fa === neededFa; });
    if (poolMatch) {
      window.pickSbToken(poolMatch.id);
    } else {
      initSentenceBuilder(state.sbIndex, false);
      const firstMatch = state.sbPoolTokens.find(function (t) { return t.fa === item.tokens[0].fa; });
      if (firstMatch) window.pickSbToken(firstMatch.id);
    }
  };

  window.checkSbAnswer = function () {
    const item = window.FARSIYAR_DATA.sentenceBuilders[state.sbIndex];
    const userFa = state.sbSelectedTokens.map(function (t) { return t.fa; }).join(" ").trim();
    const expectedFa = item.tokens.map(function (t) { return t.fa; }).join(" ").trim();

    if (userFa === expectedFa) {
      state.sbStatus = "correct";
      if (!state.completedSb[item.id]) {
        state.completedSb[item.id] = true;
        state.xp += 20;
      }
      playSynthTone("success", false);
      window.speakPersian(item.targetFa, item.targetSoraniPron, false);
      saveState();
    } else {
      state.sbStatus = "wrong";
      playSynthTone("error", false);
    }
    renderBuilderView();
  };

  function renderBuilderView() {
    const container = document.getElementById("view-container");
    if (!container) return;

    const list = window.FARSIYAR_DATA.sentenceBuilders;
    const item = list[state.sbIndex];
    const showPron = isPronVisible(item.id);

    let navDots = "";
    list.forEach(function (sb, i) {
      const done = Boolean(state.completedSb[sb.id]);
      const active = i === state.sbIndex;
      navDots += `
        <button type="button" onclick="selectSbExercise(${i})" class="w-8 h-8 rounded-xl text-xs font-bold border transition ${
          active
            ? "bg-blue-600 border-cyan-400 text-white shadow-md"
            : done
            ? "bg-emerald-600/20 border-emerald-500/40 text-emerald-300"
            : "bg-slate-900 border-slate-800 text-slate-400 hover:text-white"
        }">${i + 1}</button>
      `;
    });

    let selectedHtml = "";
    if (!state.sbSelectedTokens.length) {
      selectedHtml = `<div class="text-xs sm:text-sm text-slate-500 py-4">کرتە لەسەر وشە فارسییەکانی خوارەوە بکە بۆ ڕێکخستنی ڕستەکە لێرە...</div>`;
    } else {
      state.sbSelectedTokens.forEach(function (t) {
        selectedHtml += `
          <button type="button" onclick="unpickSbToken('${t.id}')" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-rose-600 text-white font-bold text-sm shadow transition flex flex-col items-center">
            <span lang="fa" class="text-base">${t.fa}</span>
            ${showPron ? `<span class="text-[11px] text-cyan-200 font-normal mt-0.5">${t.pron}</span>` : ""}
          </button>
        `;
      });
    }

  // VIEW 4: CONVERSATIONS (گفتوگۆکان)
  // =========================================================================
  function stopConversationPlayback() {
    if (convPlayTimer) {
      clearTimeout(convPlayTimer);
      convPlayTimer = null;
    }
    state.convPlayingTurn = -1;
  }

  window.selectConversation = function (convId) {
    stopConversationPlayback();
    state.convId = convId;
    saveState();
    renderConversationsView();
  };

  window.setConvRegister = function (reg) {
    state.convRegister = reg;
    saveState();
    renderConversationsView();
  };

  window.setConvRoleplayMask = function (mask) {
    state.convRoleplayMask = mask;
    renderConversationsView();
  };

  window.playFullConversation = function () {
    const conv = window.FARSIYAR_DATA.conversations.find(function (c) { return c.id === state.convId; }) || window.FARSIYAR_DATA.conversations[0];
    if (state.convPlayingTurn !== -1) {
      stopConversationPlayback();
      renderConversationsView();
      return;
    }

    let idx = 0;
    function step() {
      if (idx >= conv.turns.length) {
        stopConversationPlayback();
        renderConversationsView();
        return;
      }
      state.convPlayingTurn = idx;
      renderConversationsView();
      const t = conv.turns[idx];
      const faToSpeak = state.convRegister === "formal" ? t.formalFa : t.spokenFa;
      const pronToShow = state.convRegister === "formal" ? t.formalSoraniPron : t.spokenSoraniPron;
      window.speakPersian(faToSpeak, pronToShow, false);
      idx++;
      convPlayTimer = setTimeout(step, 3800);
    }
    step();
  };

  // =========================================================================
  // VIEW 5: QUIZZES (تاقیکردنەوە)
  // =========================================================================
  function getFilteredQuizzes() {
    const all = window.FARSIYAR_DATA.quizzes;
    if (state.quizFilter === "هەمووی") return all;
    return all.filter(function (q) { return q.category === state.quizFilter; });
  }

  window.setQuizFilter = function (cat) {
    state.quizFilter = cat;
    state.quizIndex = 0;
    state.quizSelectedOption = null;
    state.quizScore = 0;
    state.quizAnsweredCount = 0;
    state.quizCompleted = false;
    renderQuizView();
  };

  window.answerQuiz = function (optIdx) {
    if (state.quizSelectedOption !== null) return;
    const list = getFilteredQuizzes();
    const q = list[state.quizIndex];
    if (!q) return;

    state.quizSelectedOption = optIdx;
    state.quizAnsweredCount++;
    const chosen = q.options[optIdx];
    if (chosen && chosen.isCorrect) {
      state.quizScore++;
      state.xp += 15;
      playSynthTone("success", false);
    } else {
      playSynthTone("error", false);
    }
    window.speakPersian(q.audioText, q.soraniPronTarget, false);
    saveState();
    renderQuizView();
  };

  window.nextQuizQuestion = function () {
    const list = getFilteredQuizzes();
    if (state.quizIndex + 1 >= list.length) {
      state.quizCompleted = true;
      state.quizHistory.unshift({
        date: "2026-10-21",
        category: state.quizFilter,
        score: state.quizScore,
        total: list.length
      });
      if (state.quizHistory.length > 8) state.quizHistory.pop();
      saveState();
    } else {
      state.quizIndex++;
      state.quizSelectedOption = null;
    }
    renderQuizView();
  };

  window.restartQuiz = function () {
    state.quizIndex = 0;
    state.quizSelectedOption = null;
    state.quizScore = 0;
    state.quizAnsweredCount = 0;
    state.quizCompleted = false;
    renderQuizView();
  };

  function renderQuizView() {
    const container = document.getElementById("view-container");
    if (!container) return;

    const categories = ["هەمووی", "جیاوازیی فەرمی و ئاخاوتنی", "تێگەیشتنی بیستن 🔊", "واتای وشە و ڕستە", "هاوبەشی و دەنگسازی"];
    const list = getFilteredQuizzes();

    let filterHtml = "";
    categories.forEach(function (c) {
      filterHtml += `
        <button type="button" onclick="setQuizFilter('${c}')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${
          state.quizFilter === c ? "bg-blue-600 text-white" : "bg-slate-900 border border-slate-800 text-slate-300"
        }">${c}</button>
      `;
    });

    if (state.quizCompleted || !list.length) {
      const pct = list.length ? Math.round((state.quizScore / list.length) * 100) : 0;
      container.innerHTML = `
        <section class="max-w-2xl mx-auto">
          <div class="rounded-3xl bg-slate-900 border border-blue-500/40 p-6 sm:p-8 text-center shadow-2xl">

            <div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden mb-6">
              <div class="h-full bg-gradient-to-l from-emerald-400 to-cyan-500" style="width: ${pct}%"></div>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-3">
              <button type="button" onclick="restartQuiz()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm">
                🔄 دووبارەکردنەوەی تاقیکردنەوە

              </button>
            </div>
          </div>
        </section>

    }

    const q = list[state.quizIndex];

    let optionsHtml = "";

    container.innerHTML = `

          <h2 class="text-xl sm:text-2xl font-extrabold text-white mb-1">🎯 تاقیکردنەوەی زیرەک و هەڵسەنگاندنی ئاست</h2>

          ${filterHtml}
        </div>

        <div class="rounded-3xl bg-slate-900/90 border border-blue-500/30 p-5 sm:p-7 shadow-xl">
          <div class="flex items-center justify-between text-xs text-slate-400 mb-4">
            <span>پرسیاری ${state.quizIndex + 1} لە ${list.length} (${q.category})</span>
            <span class="text-emerald-400 font-bold">نمرە: ${state.quizScore} / ${state.quizAnsweredCount}</span>
          </div>

          <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 mb-5">
            <p class="text-base sm:text-lg font-bold text-white mb-3">${q.questionSorani}</p>
            <div class="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-slate-800/80">
              <div>
                <div class="text-lg font-extrabold text-cyan-300" lang="fa">${q.faTarget}</div>
                ${
                  showPron
                    ? `<div class="text-xs text-slate-300 mt-0.5">خوێندنەوە بە سۆرانی: <strong>${q.soraniPronTarget}</strong></div>`
                    : ""
                }
              </div>
              <div class="flex items-center gap-2">
                <button type="button" onclick="speakPersian('${q.audioText.replace(/'/g, "\\'")}', '${q.soraniPronTarget.replace(/'/g, "\\'")}', false)" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold">
                  🔊 لێدانی دەنگ
                </button>
                <button type="button" onclick="speakPersian('${q.audioText.replace(/'/g, "\\'")}', '${q.soraniPronTarget.replace(/'/g, "\\'")}', true)" class="px-2.5 py-2 rounded-xl bg-slate-800 text-slate-200 text-xs">
                  🐢
                </button>
              </div>
            </div>
          </div>

          <div class="space-y-3 mb-5">
            ${optionsHtml}
          </div>

          ${
            state.quizSelectedOption !== null
              ? `<div class="p-4 rounded-2xl bg-blue-950/60 border border-cyan-500/40 mb-4">
                   <div class="text-xs font-bold text-cyan-300 mb-1">💡 ڕوونکردنەوەی زمانەوانی:</div>
                   <p class="text-xs sm:text-sm text-slate-200 leading-relaxed">${q.explanation}</p>
                 </div>
                 <div class="flex justify-end">
                   <button type="button" onclick="nextQuizQuestion()" class="px-6 py-2.5 rounded-xl bg-gradient-to-l from-blue-600 to-cyan-600 text-white font-bold text-sm shadow-lg">
                     ${state.quizIndex + 1 >= list.length ? "🏁 بینینی ئەنجامی کۆتایی" : "پرسیاری دواتر ⬅️"}
                   </button>
                 </div>`
              : ""
          }
        </div>
      </section>
    `;
  }

  // =========================================================================
  // VIEW 6: PROGRESS, OFFLINE CACHE & AI VS LOCAL TRANSPARENCY (پێشکەوتن و دەربارە)
  // =========================================================================
  window.cacheLessonsOffline = function () {
    if ("caches" in window) {
      window.caches.open(CACHE_NAME).then(function (cache) {
        return cache.addAll([window.location.href]);
      }).then(function () {
        state.offlineCached = true;
        saveState();
        renderProgressView();
        showToast("✅ هەموو وانەکان لە بیرگەی ئۆفلاین پاشەکەوت کران", "Offline Cache API + LocalStorage", "");
      }).catch(function () {
        state.offlineCached = true;
        saveState();
        renderProgressView();
        showToast("✅ داتا بنەڕەتییەکان لە ناو فایلی ناوخۆییدا مسۆگەر کران", "ئامادەی کارکردنی بێ ئینتەرنێت", "");
      });
    } else {
      state.offlineCached = true;
      saveState();
      renderProgressView();
      showToast("✅ داتا بنەڕەتییەکان لە ناو فایلی ناوخۆییدا مسۆگەر کران", "", "");
    }
  };

  window.exportProgressJson = function () {
    const jsonStr = JSON.stringify(state, null, 2);
    const box = document.getElementById("backup-json-textarea");
    if (box) {
      box.value = jsonStr;
      box.select();
      try {
        document.execCommand("copy");
        showToast("📋 کۆدی پێشکەوتنەکەت کۆپی کرا!", "دەتوانیت لە شوێنێکی پارێزراو هەڵیبگریت", "");
      } catch (e) {
        showToast("کۆدی JSON لە خانەکەدا ئامادەیە", "", "");
      }
    }
  };

  window.importProgressJson = function () {
    const box = document.getElementById("backup-json-textarea");
    if (!box || !box.value.trim()) {
      showToast("⚠️ تکایە سەرەتا کۆدی JSON لە خانەکەدا دابنێ", "", "");
      return;
    }
    try {
      const parsed = JSON.parse(box.value.trim());
      state = Object.assign({}, defaultState, parsed);
      saveState();
      renderProgressView();
      showToast("✅ پێشکەوتنەکانت بە سەرکەوتوویی گەڕێندرانەوە!", "", "");
    } catch (e) {
      showToast("❌ فۆرماتی JSON دروست نییە", "", "");
    }
  };

  window.openResetModal = function () {
    const m = document.getElementById("reset-confirm-modal");
    if (m) m.classList.remove("hidden");
  };

  window.closeResetModal = function () {
    const m = document.getElementById("reset-confirm-modal");
    if (m) m.classList.add("hidden");
  };

  window.confirmResetProgress = function () {
    state = Object.assign({}, defaultState);
    saveState();
    window.closeResetModal();
    renderProgressView();
    showToast("🔄 پێشکەوتنەکان کرانەوە بە سفر", "", "");
  };

  function renderProgressView() {
    const container = document.getElementById("view-container");
    if (!container) return;

    const learnedItemsCount = Object.keys(state.learnedLessonItems).filter(function (k) { return state.learnedLessonItems[k]; }).length;
    const masteredVocabCount = Object.keys(state.masteredVocab).filter(function (k) { return state.masteredVocab[k]; }).length;
    const completedSbCount = Object.keys(state.completedSb).filter(function (k) { return state.completedSb[k]; }).length;

    let localFeaturesHtml = "";
    window.FARSIYAR_DATA.architectureComparison.workingLocalFeatures.forEach(function (f) {
      localFeaturesHtml += `
        <div class="p-3.5 rounded-xl bg-slate-950/90 border border-emerald-500/30">
          <div class="flex items-center justify-between gap-2 mb-1">
            <span class="font-bold text-sm text-white">✅ ${f.title}</span>
            <span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-[11px] font-bold shrink-0">${f.status}</span>
          </div>
          <p class="text-xs text-slate-300 leading-relaxed">${f.desc}</p>
        </div>
      `;
    });

    let aiFeaturesHtml = "";
    window.FARSIYAR_DATA.architectureComparison.aiBackendFeatures.forEach(function (f) {
      aiFeaturesHtml += `
        <div class="p-3.5 rounded-xl bg-slate-950/90 border border-amber-500/30">
          <div class="flex items-center justify-between gap-2 mb-1">
            <span class="font-bold text-sm text-amber-200">🤖 ${f.title}</span>
            <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[11px] font-bold shrink-0">پێویستی بە AI Backend هەیە</span>
          </div>
          <p class="text-xs text-slate-300 leading-relaxed mb-1">${f.desc}</p>
          <div class="text-[11px] text-amber-400/90 font-medium">پێداویستی: ${f.requirement}</div>
        </div>
      `;
    });

    container.innerHTML = `
      <section class="space-y-6">
        <!-- Stats Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
          <div class="p-4 rounded-2xl bg-slate-900 border border-blue-500/30">
            <div class="text-xs text-slate-400 mb-1">کۆی خاڵی ئەزموون (XP)</div>
            <div class="text-2xl font-extrabold text-cyan-400">${state.xp} XP</div>
            <div class="text-[11px] text-slate-400 mt-1">زنجیرەی بەردەوامی: 🔥 ${state.streakDays} ڕۆژ</div>
          </div>
          <div class="p-4 rounded-2xl bg-slate-900 border border-blue-500/30">
            <div class="text-xs text-slate-400 mb-1">بڕگە فێربووەکانی وانە</div>
            <div class="text-2xl font-extrabold text-white">${learnedItemsCount} / 36</div>
            <div class="text-[11px] text-emerald-400 mt-1">لە کۆی ٦ یەکەی سەرەکی</div>
          </div>
          <div class="p-4 rounded-2xl bg-slate-900 border border-blue-500/30">
            <div class="text-xs text-slate-400 mb-1">وشە فێربووەکان</div>
            <div class="text-2xl font-extrabold text-amber-300">${masteredVocabCount} / ${window.FARSIYAR_DATA.vocabulary.length}</div>
            <div class="text-[11px] text-slate-400 mt-1">فەرهەنگی فارسی-سۆرانی</div>
          </div>
          <div class="p-4 rounded-2xl bg-slate-900 border border-blue-500/30">
            <div class="text-xs text-slate-400 mb-1">ڕاهێنانی ڕستەسازی</div>
            <div class="text-2xl font-extrabold text-indigo-300">${completedSbCount} / ${window.FARSIYAR_DATA.sentenceBuilders.length}</div>
            <div class="text-[11px] text-slate-400 mt-1">ڕستەی تەواوکراو</div>
          </div>
        </div>

        <!-- Offline & Audio Status -->
        <div class="rounded-3xl bg-gradient-to-l from-blue-950/90 via-slate-900 to-slate-900 border border-cyan-500/30 p-5 sm:p-6">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
              <span class="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 text-xs font-bold">⚡ دۆخی کارکردنی بێ ئینتەرنێت (Offline-First PWA)</span>
              <h3 class="text-lg sm:text-xl font-extrabold text-white mt-2">هەموو وانە بنەڕەتییەکان بەبێ ئینتەرنێت کار دەکەن</h3>
              <p class="text-xs sm:text-sm text-slate-300 mt-1 max-w-2xl">
                کۆمەڵەی وانەکان، ٤٨ وشەی فەرهەنگ، ١٢ ڕاهێنانی ڕستەسازی، ٥ گفتوگۆ و تاقیکردنەوەکان لە ناو کۆدی ئەپەکە و بیرگەی ناوخۆیی وێبگەڕەکەتدا جێگیر کراون.
              </p>
              <p class="text-xs text-cyan-300 mt-2">
                🔊 دۆخی دەنگی فارسی لێرە: <strong>${faVoiceFound ? "Web Speech API (fa-IR چالاکە)" : "Web Speech API + سینتەسایزەری ناوخۆیی و ڕێنووسی سۆرانی"}</strong>
              </p>
            </div>
            <button type="button" onclick="cacheLessonsOffline()" class="px-4 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs sm:text-sm shadow-lg transition">
              ${state.offlineCached ? "✅ وانەکان بۆ ئۆفلاین پاشەکەوت کراون" : "📥 چالاککردنی بیرگەی ئۆفلاین"}
            </button>
          </div>
        </div>

        <!-- Working Features vs AI Backend Features -->
        <div class="rounded-3xl bg-slate-900/90 border border-slate-800 p-5 sm:p-6">
          <h3 class="text-lg sm:text-xl font-extrabold text-white mb-1">🔍 جیاکردنەوەی ڕوونی تایبەتمەندییە کاراکان و زیرەکیی دەستکرد (AI Backend)</h3>
          <p class="text-xs sm:text-sm text-slate-400 mb-5">
            بۆ شەفافییەتی تەواو، لێرەدا جیاوازیی نێوان ئەو بەشانەی ١٠٠٪ لەناو وێبگەڕەکەتدا بەبێ سێرڤەر کار دەکەن و ئەو بەشانەی لە داهاتوودا پێویستیان بە سێرڤەری AI دەبێت خراوەتە ڕوو:
          </p>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div>
              <div class="text-sm font-bold text-emerald-400 mb-3">🟢 تایبەتمەندییە تەواو کاراکان (بێبەرامبەر، ناوخۆیی و ئۆفلاین)</div>
              <div class="space-y-3">
                ${localFeaturesHtml}
              </div>
            </div>
            <div>
              <div class="text-sm font-bold text-amber-400 mb-3">🟡 تایبەتمەندییەکانی پێویست بە سێرڤەری زیرەکی دەستکرد (Optional AI Backend)</div>
              <div class="space-y-3">
                ${aiFeaturesHtml}
              </div>
            </div>
          </div>
        </div>

        <!-- Cloudflare Pages Deployment Guide & Local Backup -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <div class="rounded-3xl bg-slate-900/90 border border-slate-800 p-5">
            <h3 class="text-base sm:text-lg font-bold text-white mb-2">☁️ ڕێنمایی بڵاوکردنەوە لەسەر Cloudflare Pages (بێبەرامبەر)</h3>
            <ol class="text-xs sm:text-sm text-slate-300 space-y-2 list-decimal list-inside leading-relaxed">
              <li>فایلی پڕۆژەکە (<code class="text-cyan-300">farsiyar-cloudflare-pages.zip</code> یان <code class="text-cyan-300">index.html</code> + <code class="text-cyan-300">sw.js</code> + <code class="text-cyan-300">manifest.json</code>) دابگرە.</li>
              <li>لە هەژماری بێبەرامبەری <strong>Cloudflare Dashboard</strong> بچۆ سەر بەشی <strong>Workers & Pages → Create → Pages → Upload Assets</strong>.</li>
              <li>ناوی پڕۆژەکە بنووسە <code class="text-cyan-300">farsiyar</code> و فایلەکان بار بکە یان بە فەرمانی <code class="text-cyan-300">npx wrangler pages deploy . --project-name=farsiyar</code> بڵاوی بکەرەوە.</li>
              <li>بەهۆی بوونی <code class="text-cyan-300">sw.js</code> و <code class="text-cyan-300">manifest.json</code>، بەکارهێنەرانی ئایفۆن و ئەندرۆید دەتوانن وەک ئەپ (Add to Home Screen) دایبمەزرێنن.</li>
            </ol>
          </div>

          <div class="rounded-3xl bg-slate-900/90 border border-slate-800 p-5">
            <h3 class="text-base sm:text-lg font-bold text-white mb-2">💾 هەناردە و هاوردەکردنی پێشکەوتنەکان (JSON Backup)</h3>
            <p class="text-xs text-slate-400 mb-3">دەتوانیت کۆپییەکی پێشکەوتنەکانت هەڵبگریت یان لە ئامێرێکی ترەوە بیگەڕێنیتەوە:</p>
            <textarea id="backup-json-textarea" rows="3" placeholder="کرتە لە (هەناردەکردن) بکە یان کۆدی JSON لێرە دابنێ..." class="w-full p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-cyan-200 font-mono mb-3" dir="ltr"></textarea>
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <button type="button" onclick="exportProgressJson()" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold">📤 هەناردەکردنی JSON</button>
                <button type="button" onclick="importProgressJson()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold">📥 هاوردەکردن</button>
              </div>
              <button type="button" onclick="openResetModal()" class="px-3.5 py-2 rounded-xl bg-rose-950/80 hover:bg-rose-900 border border-rose-500/40 text-rose-300 text-xs font-bold">
                🗑️ سفرکردنەوەی پێشکەوتن
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Custom In-Page Reset Modal -->
      <div id="reset-confirm-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="max-w-md w-full rounded-2xl bg-slate-900 border border-rose-500/40 p-6 shadow-2xl text-right">
          <h4 class="text-lg font-bold text-white mb-2">دڵنیایت لە سفرکردنەوەی پێشکەوتنەکان؟</h4>
          <p class="text-xs sm:text-sm text-slate-300 mb-5">هەموو خاڵەکانی XP و نیشانەی وانە تەواوکراوەکانت لەسەر ئەم ئامێرە دەسڕێنەوە.</p>
          <div class="flex items-center justify-end gap-2">
            <button type="button" onclick="closeResetModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-200 text-xs font-bold">پاشگەزبوونەوە</button>
            <button type="button" onclick="confirmResetProgress()" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold">بەڵێ، سفری بکەرەوە</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderActiveView() {
    updateHeaderStats();
    if (state.activeTab === "lessons") renderLessonsView();
    else if (state.activeTab === "vocab") renderVocabView();
    else if (state.activeTab === "builder") renderBuilderView();
    else if (state.activeTab === "conversations") renderConversationsView();
    else if (state.activeTab === "quiz") renderQuizView();
    else if (state.activeTab === "progress") renderProgressView();
  }

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
    function bootFarsiYar() {
    if (window.__farsiyarBooted) return;
    window.__farsiyarBooted = true;
    loadState();
    renderNavigation();
    renderActiveView();
  }
  if (document.readyState === "loading") {
    window.addEventListener("DOMContentLoaded", bootFarsiYar);
  } else {
    bootFarsiYar();
  }
})();

  </script>
</body>
</html>
